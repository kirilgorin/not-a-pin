name: Attest release files

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose files should be attested
        required: true
        type: string
        default: 1.0.3
  release:
    types: [published]

permissions: {}

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      - name: Attest plugin files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
